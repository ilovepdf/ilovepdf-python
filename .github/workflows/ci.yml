name: Python CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_MIN_VERSION: "3.10"
  PYTHON_MAX_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_MIN_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_MIN_VERSION }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install pre-commit
          pip install -e .

      - name: Run all linters via pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  unit_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Install package
        run: pip install .

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit \
            --cov=ilovepdf \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=85 \
            --timeout=30 \
            -v \
            --tb=short

  installation_validation:
    runs-on: ubuntu-latest
    needs: unit_test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_MIN_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_MIN_VERSION }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Validate global installation
        run: bash .github/workflows/scripts/install_and_verify.sh global

      - name: Validate user installation
        run: bash .github/workflows/scripts/install_and_verify.sh user

      - name: Validate VCS installation from current ref
        run: |
          pip install -U "git+https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git@${{ github.sha }}#egg=ilovepdf"
          bash .github/workflows/scripts/install_and_verify.sh user

  integration_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    needs: installation_validation
    if: github.event_name == 'push'
    env:
      ILOVEPDF_PUBLIC_KEY: ${{ secrets.ILOVEPDF_PUBLIC_KEY }}
      ILOVEPDF_SECRET_KEY: ${{ secrets.ILOVEPDF_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Install package
        run: pip install .

      - name: Run integration tests
        run: |
          pytest tests/integration \
            --timeout=60 \
            -v \
            --tb=short

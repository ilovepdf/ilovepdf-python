name: Integration Tests

on:
  push:
    tags:
      - "integration-*"

jobs:
  validate_secrets:
    name: Validate API Keys
    uses: ./.gitea/workflows/jobs/validate-secrets.yml
    secrets:
      ILOVEPDF_PUBLIC_KEY: ${{ secrets.ILOVEPDF_PUBLIC_KEY }}
      ILOVEPDF_SECRET_KEY: ${{ secrets.ILOVEPDF_SECRET_KEY }}

  integration_test:
    name: Integration Tests
    needs: validate_secrets
    if: needs.validate_secrets.outputs.secrets_available == 'true'
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.14"]
    uses: ./.gitea/workflows/jobs/integration-test.yml
    with:
      python-version: ${{ matrix.python-version }}
    secrets:
      ILOVEPDF_PUBLIC_KEY: ${{ secrets.ILOVEPDF_PUBLIC_KEY }}
      ILOVEPDF_SECRET_KEY: ${{ secrets.ILOVEPDF_SECRET_KEY }}

  notify_failure:
    name: Notify Failure
    needs: [validate_secrets, integration_test]
    if: failure()
    uses: ./.gitea/workflows/jobs/notify-telegram.yml
    with:
      result: "failure"
      workflow_name: "Integration Tests"
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  notify_success:
    name: Notify Success
    needs: [validate_secrets, integration_test]
    if: success()
    uses: ./.gitea/workflows/jobs/notify-telegram.yml
    with:
      result: "success"
      workflow_name: "Integration Tests"
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

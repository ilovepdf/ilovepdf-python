name: Quick CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
    paths:
      - "ilovepdf/**/*.py"
      - "tests/**/*.py"
      - "samples/**/*.py"
      - "*.py"
      - "pyproject.toml"
      - "requirements*.txt"
  pull_request:
    paths:
      - "ilovepdf/**/*.py"
      - "tests/**/*.py"
      - "samples/**/*.py"
      - "*.py"
      - "pyproject.toml"
      - "requirements*.txt"
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    uses: ./.gitea/workflows/jobs/lint.yml
    with:
      python-version: "3.10"

  unit_test:
    name: Unit Tests
    needs: lint
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.14"]
    uses: ./.gitea/workflows/jobs/unit-test.yml
    with:
      python-version: ${{ matrix.python-version }}

  notify_failure:
    name: Notify Failure
    needs: [lint, unit_test]
    if: failure()
    uses: ./.gitea/workflows/jobs/notify-telegram.yml
    with:
      result: "failure"
      workflow_name: "Quick CI"
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  notify_success:
    name: Notify Success
    needs: [lint, unit_test]
    if: success()
    uses: ./.gitea/workflows/jobs/notify-telegram.yml
    with:
      result: "success"
      workflow_name: "Quick CI"
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

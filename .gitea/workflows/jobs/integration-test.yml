name: Integration Test Job

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.10"
    secrets:
      ILOVEPDF_PUBLIC_KEY:
        required: true
      ILOVEPDF_SECRET_KEY:
        required: true

jobs:
  integration_test:
    name: Integration Tests (Python ${{ inputs.python-version }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    env:
      ILOVEPDF_PUBLIC_KEY: ${{ secrets.ILOVEPDF_PUBLIC_KEY }}
      ILOVEPDF_SECRET_KEY: ${{ secrets.ILOVEPDF_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Install package
        run: pip install .

      - name: Run integration tests
        run: |
          echo "Running integration tests against iLovePDF API..."
          echo "Python version: ${{ inputs.python-version }}"
          echo "This may take several minutes..."
          pytest tests/integration \
            --timeout=60 \
            -v \
            --tb=short

      - name: Integration test summary
        if: always()
        run: |
          echo "Integration tests completed for Python ${{ inputs.python-version }}"
          echo "Note: These tests interact with the real iLovePDF API"

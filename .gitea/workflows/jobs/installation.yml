name: Installation Job

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.10"

jobs:
  installation_validation:
    name: Installation Validation (Python ${{ inputs.python-version }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Validate global installation
        run: bash .gitea/workflows/scripts/install_and_verify.sh global

      - name: Validate user installation
        run: bash .gitea/workflows/scripts/install_and_verify.sh user

      - name: Validate VCS installation from current ref
        run: |
          pip install -U "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git@${{ github.sha }}#egg=ilovepdf"
          bash .gitea/workflows/scripts/install_and_verify.sh user

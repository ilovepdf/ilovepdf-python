name: Release to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install build twine
          python -m build
          twine upload dist/*

      - name: Success
        run: |
          echo "✅ Published to PyPI"
          echo "Install: pip install ilovepdf"

  notify_failure:
    name: Notify Failure
    needs: [publish]
    if: failure()
    uses: ./.gitea/workflows/jobs/notify-telegram.yml
    with:
      result: "failure"
      workflow_name: "Release to PyPI"
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  notify_success:
    name: Notify Success
    needs: [publish]
    if: success()
    uses: ./.gitea/workflows/jobs/notify-telegram.yml
    with:
      result: "success"
      workflow_name: "Release to PyPI"
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
